name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

# Untrusted code runs in the build/lint/test jobs (freshly resolved dependencies),
# so the default token must stay read-only regardless of the repository setting;
# publish jobs override this with their own job-level permissions.
permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - name: Build distribution
      run: uv build
    - name: File list
      run: tar tf dist/*.tar.gz && unzip -l dist/*.whl
    - name: Check distribution metadata
      run: uvx twine check --strict dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dist
        path: dist/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - name: Ruff check
      run: uv run ruff check src tests
    - name: Ruff format
      run: uv run ruff format --check src tests
    - name: mypy
      run: uv run mypy src

  test:
    name: Run tests
    needs: build
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist
    - name: Install wheel
      shell: bash
      run: pip install dist/*.whl
    - name: Install test requirements
      run: pip install pytest
    - name: Test
      run: pytest

  pypi-publish-test:
    name: Release on Test PyPI
    needs: [test, lint]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: Test PyPI
      url: "https://test.pypi.org/project/verify-oidc-token/"
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: "https://test.pypi.org/legacy/"

  github-release:
    name: Release on GitHub
    needs: [test, lint]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: GitHub
      url: "https://github.com/ei-grad/verify-oidc-token/releases/"
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Extract Version from Tag
        run: echo "VERSION_FROM_GIT_REF=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Extract Version from pyproject.toml
        run: |
          pip install toml
          VERSION_FROM_PYPROJECT=$(python << EOF
          import toml
          print(toml.load('pyproject.toml')['project']['version'])
          EOF
          )
          echo "VERSION_FROM_PYPROJECT=$VERSION_FROM_PYPROJECT" >> $GITHUB_ENV
      - name: Ensure version consistency
        run: |
          if [ "$VERSION_FROM_GIT_REF" != "$VERSION_FROM_PYPROJECT" ]; then
            echo "Error: Version from tag ($VERSION_FROM_GIT_REF) does not match version in pyproject.toml ($VERSION_FROM_PYPROJECT)"
            exit 1
          fi
          echo VERSION=$VERSION_FROM_GIT_REF >> $GITHUB_ENV
      - name: Extract changelog for release notes
        run: |
          (
            echo "CHANGELOG<<EOF"
            awk -v version="$VERSION" '{
                if ($0 ~ "^## \\[" version "\\]") inSection = 1;
                else if ($0 ~ "^## \\[" && inSection) inSection = 0;
                if (inSection) print $0;
            }' CHANGELOG.md
            echo "EOF"
          ) >> $GITHUB_ENV
      - name: Validate changelog content
        run: |
          if [ -z "$CHANGELOG" ] ; then
            echo "Missing CHANGELOG.md section for release $VERSION"
            exit 1
          fi
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --notes "$CHANGELOG"
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" dist/**

  pypi-publish:
    name: Release on PyPI
    needs: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: "https://pypi.org/project/verify-oidc-token/"
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
